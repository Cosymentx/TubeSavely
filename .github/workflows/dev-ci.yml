name: Dev CI - Test & Build Check

# 当向 dev 分支推送或提交 PR 时自动触发测试与编译检查
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

# 同分支只保留最新一次构建，旧的自动取消以节省 Actions 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Code Analysis & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 # 极速浅克隆，大幅节省拉取时间

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # 自动缓存 Flutter SDK 与 Pub 依赖

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/ test/

      - name: Run Unit Tests
        run: flutter test

      - name: Fast Compilation Sanity Check (Android Debug)
        run: flutter build apk --debug
